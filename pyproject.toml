[project]
name = "pi-point-forecast"
version = "0.1.0"
description = "PI and Point Forecasting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chronos-forecasting[extras]>=2.2.0",
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "iprogress>=0.4",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "nbformat>=4.20",
    "numpy>=2.3.5",
    "nvitop>=1.6.1",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "progress-table>=3.2.2",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "torch>=2.9.1",
    "wandb>=0.23.1",
    "widgetsnbextension>=4.0.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
extend-select = ["I"]
